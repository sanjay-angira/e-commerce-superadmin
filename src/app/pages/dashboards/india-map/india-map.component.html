<div class="vr-card india-map-card">
  <div class="panel-head">
    <h3>India Warehouse Coverage</h3>
  </div>

  <div class="map-wrap">
    @if (loading()) {
      <div class="map-overlay" aria-busy="true">
        <span class="vr-sr-only">Loading India map</span>
        <div class="map-skel vr-skeleton" aria-hidden="true"></div>
      </div>
    } @else if (error()) {
      <p class="map-error">{{ error() }}</p>
    }

    <div #mapHost class="map-host" [class.is-hidden]="!!error()"></div>
  </div>
</div>
