
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Product FAQ' : 'Add Product FAQ'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <mat-form-field appearance="outline">
      <mat-label>Question</mat-label>
      <input matInput formControlName="question" />
    </mat-form-field>
    <app-quill-editor label="Answer" [required]="true" formControlName="answer" />
    <mat-form-field appearance="outline">
      <mat-label>Product</mat-label>
      <mat-select formControlName="productId">
        @for (opt of products(); track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update FAQ' : 'Create FAQ' }}
      </button>
      <a mat-stroked-button [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
