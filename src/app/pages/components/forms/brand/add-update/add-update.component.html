
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Brand' : 'Add Brand'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <mat-form-field appearance="outline">
      <mat-label>Brand Name</mat-label>
      <input matInput formControlName="brandName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Website</mat-label>
      <input matInput formControlName="website" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Categories</mat-label>
      <mat-select formControlName="categoryIds" multiple>
        @for (opt of categories(); track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Offers</mat-label>
      <mat-select formControlName="offerIds" multiple>
        @for (opt of offers(); track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <app-image-upload class="full" label="Brand Logo" [path]="uploadPath" formControlName="logo" />
    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
        {{ isEdit() ? 'Update Brand' : 'Create Brand' }}
      </button>
      <a mat-stroked-button [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
