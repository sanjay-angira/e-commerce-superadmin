
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Review' : 'Add Review'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <mat-form-field appearance="outline">
      <mat-label>Rating</mat-label>
      <mat-select formControlName="rating">
        @for (n of ratings; track n) {
          <mat-option [value]="n">{{ n }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <app-quill-editor label="Comment" [required]="true" formControlName="comment" />
    <mat-form-field appearance="outline">
      <mat-label>Product</mat-label>
      <mat-select formControlName="productId">
        @for (opt of products(); track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-checkbox formControlName="isManual">Manual review</mat-checkbox>
    @if (form.controls.isManual.value) {
      <mat-form-field appearance="outline">
        <mat-label>User Name</mat-label>
        <input matInput formControlName="userName" />
      </mat-form-field>
    } @else {
      <mat-form-field appearance="outline">
        <mat-label>User</mat-label>
        <mat-select formControlName="userId">
          @for (opt of users(); track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    }
    <mat-slide-toggle formControlName="isApproved">Approved</mat-slide-toggle>
    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update Review' : 'Create Review' }}
      </button>
      <a mat-stroked-button [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
