
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Offer' : 'Add Offer'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <mat-form-field appearance="outline">
      <mat-label>Offer Name</mat-label>
      <input matInput formControlName="offerName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Offer Slug</mat-label>
      <input matInput formControlName="offerSlug" (input)="markSlugDirty()" />
    </mat-form-field>
    <app-image-upload label="Image" [path]="uploadPath" formControlName="image" />
    <mat-form-field appearance="outline">
      <mat-label>Discount Type</mat-label>
      <mat-select formControlName="discountType">
        <mat-option value="percentage">Percentage</mat-option>
        <mat-option value="fixed">Fixed</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Discount Value</mat-label>
      <input matInput type="number" formControlName="discountValue" />
    </mat-form-field>
    <mat-checkbox formControlName="timeBased">Time Based</mat-checkbox>
    @if (form.controls.timeBased.value) {
      <mat-form-field appearance="outline">
        <mat-label>Start Date/Time</mat-label>
        <input matInput type="datetime-local" formControlName="startDateTime" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>End Date/Time</mat-label>
        <input matInput type="datetime-local" formControlName="endDateTime" />
      </mat-form-field>
    }
    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update Offer' : 'Create Offer' }}
      </button>
      <a mat-stroked-button [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
