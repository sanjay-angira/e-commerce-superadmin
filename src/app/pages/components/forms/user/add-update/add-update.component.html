
<app-admin-form-shell
  [title]="isEdit() ? 'Edit User' : 'Add User'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Roles</mat-label>
      <mat-select formControlName="roleIds" multiple>
        @for (opt of roles(); track opt.value) {
          <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <app-image-upload label="Profile Image" [path]="uploadPath" formControlName="profileImage" />
    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
    <div class="actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update User' : 'Create User' }}
      </button>
      <a mat-stroked-button [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
