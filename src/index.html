<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vrindavan Rasa Super Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico?v=5" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="brand/mark-48.png?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/mark-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="brand/mark-16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="brand/mark-apple.png?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('vr-superadmin-theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
